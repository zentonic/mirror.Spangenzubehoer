# ==============================================================================
# git-cliff config — nach holm.tools.public template
# Erzeugt CHANGELOG.md aus Conventional-Commit-History.
# Docs: https://git-cliff.org/docs/configuration/
# ==============================================================================

[changelog]
# header / footer der gesamten datei
header = """
# Changelog

Alle nennenswerten Änderungen an diesem Projekt werden hier dokumentiert.\n
Format orientiert sich an [Keep a Changelog](https://keepachangelog.com/de/1.1.0/),\n
Versionen folgen [Semantic Versioning](https://semver.org/lang/de/).\n
"""

# template pro release (tera-syntax)
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] – {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [unreleased]
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif -%}
  {{ commit.message | upper_first | trim }}\
  {% if commit.breaking %} 💥{% endif %}\
  {% if commit.id %} ([`{{ commit.id | truncate(length=7, end="") }}`]){% endif %}
{%- endfor %}
{% endfor %}\n
"""

footer = """
<!-- generated by git-cliff -->
"""

trim = true

[git]
# nur conventional commits ernst nehmen
conventional_commits = true
filter_unconventional = true
split_commits = false

# breaking-change marker
protect_breaking_commits = true

# commits → gruppen mappen (regex auf header)
commit_parsers = [
  { message = "^feat", group = "✨ Added" },
  { message = "^fix", group = "🐛 Fixed" },
  { message = "^perf", group = "⚡ Performance" },
  { message = "^refactor", group = "🔧 Changed" },
  { message = "^revert", group = "⏪ Reverted" },
  { message = "^docs", group = "📝 Documentation" },
  { message = "^security", group = "🔐 Security" },
  { body = ".*[Ss]ecurity", group = "🔐 Security" },
  # rauswerfen — kein changelog-rauschen
  { message = "^style", skip = true },
  { message = "^test", skip = true },
  { message = "^chore", skip = true },
  { message = "^build", skip = true },
  { message = "^ci", skip = true },
  { message = "^wip", skip = true },
  { message = "^Merge", skip = true },
]

# reihenfolge der gruppen im output
filter_commits = true
topo_order = false
sort_commits = "oldest"

# tags die als release zählen (v1.2.3 oder 1.2.3)
tag_pattern = "v?[0-9]+\\.[0-9]+\\.[0-9]+"

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
